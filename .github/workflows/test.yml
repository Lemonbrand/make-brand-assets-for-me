name: Test the package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q tests
      - name: Check synchronized skill copies
        run: |
          python scripts/sync_shared_rules.py --root . --check
          python scripts/sync_asset_tools.py --root . --check
          python scripts/sync_distribution_skills.py --root . --check
      - name: Check the public package
        run: |
          python scripts/check_package.py .
          python scripts/check_for_private_stuff.py .
